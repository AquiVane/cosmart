<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#050d1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}
.loading{color:#64748b;font-size:14px;text-align:center;padding:4rem}

/* ── Certificate card ── */
.cert-wrap{width:100%;max-width:720px}
.cert-card{
  background:linear-gradient(160deg,#0a1628 0%,#071020 60%,#0d1f40 100%);
  border:1px solid #1e3a6e;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 60px rgba(29,78,216,.2),0 20px 60px rgba(0,0,0,.5);
  position:relative;
}
/* corner decorations */
.cert-card::before,
.cert-card::after{
  content:'';position:absolute;width:120px;height:120px;
  border:2px solid rgba(59,130,246,.2);border-radius:4px;
}
.cert-card::before{top:16px;left:16px;border-right:none;border-bottom:none}
.cert-card::after{bottom:16px;right:16px;border-left:none;border-top:none}

/* header */
.cert-header{
  background:linear-gradient(90deg,#0d1f40,#1a3a7a,#0d1f40);
  padding:1.75rem 2.5rem;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(59,130,246,.2);
  gap:1rem;flex-wrap:wrap;
}
.cert-header img{height:36px;filter:brightness(0) invert(1);opacity:.95}
.cert-header-right{text-align:right}
.cert-header-right .label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#475569;margin-bottom:2px}
.cert-header-right .value{font-size:11px;color:#64748b;font-family:monospace}

/* body */
.cert-body{padding:3rem 3rem 2.5rem;text-align:center}
.cert-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#3b82f6;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;gap:.75rem}
.cert-eyebrow::before,.cert-eyebrow::after{content:'';flex:1;max-width:60px;height:1px;background:linear-gradient(90deg,transparent,#1d4ed8)}
.cert-eyebrow::after{background:linear-gradient(90deg,#1d4ed8,transparent)}

.cert-presents{font-size:13px;color:#64748b;margin-bottom:.5rem}
.cert-name{font-size:clamp(28px,6vw,44px);font-weight:700;color:#fff;letter-spacing:-.5px;margin-bottom:.75rem;line-height:1.1}
.cert-completed{font-size:14px;color:#94a3b8;margin-bottom:2rem}

.cert-divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.3),transparent);margin:0 0 2rem}

.cert-course-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#475569;margin-bottom:.5rem}
.cert-course{font-size:20px;font-weight:700;color:#60a5fa;margin-bottom:2.5rem}

/* meta row */
.cert-meta{display:flex;justify-content:center;gap:3rem;flex-wrap:wrap;margin-bottom:2.5rem}
.meta-col{text-align:center}
.meta-col .ml{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#475569;margin-bottom:4px}
.meta-col .mv{font-size:13px;font-weight:600;color:#cbd5e1}
.meta-col .mv.mono{font-family:monospace;font-size:11px;color:#94a3b8}

/* seal */
.cert-seal{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid rgba(59,130,246,.35);
  border-radius:999px;padding:8px 20px;
  background:rgba(29,78,216,.12);
  font-size:12px;font-weight:600;color:#93c5fd;
  margin-bottom:2rem;
}

/* footer */
.cert-footer{
  border-top:1px solid rgba(30,58,110,.5);
  padding:1rem 2.5rem;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#334155;
  gap:.5rem;
}
.cert-footer a{color:#3b82f6;text-decoration:none}

/* not found */
.not-found{text-align:center;color:#e2e8f0;padding:4rem 1rem}
.not-found h2{font-size:20px;margin-bottom:.75rem}
.not-found p{font-size:14px;color:#64748b}

@media(max-width:540px){
  .cert-body{padding:2rem 1.5rem}
  .cert-header{padding:1.25rem 1.5rem}
  .cert-footer{padding:.875rem 1.5rem}
  .cert-meta{gap:1.5rem}
  .cert-card::before,.cert-card::after{display:none}
}
</style>
</head>

(async function() {
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var certId = params.get('id');

  if (!certId) { showError('Enlace incorrecto', 'No se encontró el ID del certificado.'); return; }
