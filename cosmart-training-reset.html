<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COSMART Training — Recuperar contraseña</title>
<style>
  :root{--az1:#0D2B6B;--az2:#1A4DAA;--az3:#3A8FC7;--ro1:#E02020;--sans:'Inter',Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#060f22 0%,#0D2B6B 50%,#060f22 100%);font-family:var(--sans);padding:20px}
  .card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .logo-wrap{text-align:center;margin-bottom:28px}
  .logo-text{font-size:26px;font-weight:900;letter-spacing:2px;color:var(--az1)}
  .logo-sub{font-size:11px;letter-spacing:4px;color:var(--az3);display:block;margin-top:2px}
  h2{color:var(--az1);font-size:20px;margin-bottom:6px;text-align:center}
  .sub{color:#64748b;font-size:13px;text-align:center;margin-bottom:24px}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
  input{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:11px 14px;font-size:15px;
    outline:none;transition:border-color .2s;font-family:var(--sans)}
  input:focus{border-color:var(--az2)}
  .field{margin-bottom:18px}
  .btn{width:100%;background:var(--az1);color:#fff;border:none;border-radius:8px;padding:14px;
    font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:background .2s;margin-top:4px}
  .btn:hover{background:var(--az2)}
  .btn:disabled{background:#94a3b8;cursor:not-allowed}
  .error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;
    padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
  .success{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a;border-radius:8px;
    padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
  .back{text-align:center;margin-top:16px;font-size:13px}
  .back a{color:var(--az2);text-decoration:none;font-weight:600}
  #stepForgot,#stepReset{transition:opacity .3s}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-text">COSMART <span style="color:var(--az3);font-size:18px">Training</span></div>
    <span class="logo-sub">🔐 RECUPERAR CONTRASEÑA</span>
  </div>

  <!-- Paso 1: pedir email -->
  <div id="stepForgot">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p class="sub">Ingresá tu email y te enviamos un link para resetearla</p>
    <div class="error" id="errForgot"></div>
    <div class="success" id="okForgot"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="emailForgot" placeholder="tu@email.com">
    </div>
    <button class="btn" id="forgotBtn" onclick="sendForgot()">Enviar link de recuperación</button>
    <div class="back"><a href="/cosmart-training-login.html">← Volver al login</a></div>
  </div>

  <!-- Paso 2: nueva contraseña (si viene con ?token=...) -->
  <div id="stepReset" style="display:none">
    <h2>Nueva contraseña</h2>
    <p class="sub">Elegí una contraseña segura para tu cuenta</p>
    <div class="error" id="errReset"></div>
    <div class="success" id="okReset"></div>
    <div class="field">
      <label>Nueva contraseña</label>
      <input type="password" id="newPass" placeholder="Mínimo 8 caracteres">
    </div>
    <div class="field">
      <label>Repetir contraseña</label>
      <input type="password" id="newPass2" placeholder="Repetí tu contraseña">
    </div>
    <button class="btn" id="resetBtn" onclick="doReset()">Guardar nueva contraseña</button>
    <div class="back"><a href="/cosmart-training-login.html">← Volver al login</a></div>
  </div>
</div>

<script>
const API = 'https://cosmart-training.conglomeradocosmart.workers.dev';
const params = new URLSearchParams(window.location.search);
const resetToken = params.get('token');

if(resetToken){
  document.getElementById('stepForgot').style.display = 'none';
  document.getElementById('stepReset').style.display = 'block';
}

async function sendForgot(){
  const email = document.getElementById('emailForgot').value.trim();
  if(!email){ document.getElementById('errForgot').textContent='Ingresá tu email'; document.getElementById('errForgot').style.display='block'; return; }
  const btn = document.getElementById('forgotBtn');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    await fetch(`${API}/auth/forgot`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email}) });
    document.getElementById('okForgot').textContent = '✅ Si ese email tiene cuenta, llegará el link en unos minutos. Revisá también la carpeta de spam.';
    document.getElementById('okForgot').style.display = 'block';
    document.getElementById('errForgot').style.display = 'none';
  } catch(e){
    document.getElementById('errForgot').textContent = 'Error. Intentá de nuevo.';
    document.getElementById('errForgot').style.display = 'block';
  } finally { btn.disabled=false; btn.textContent='Enviar link de recuperación'; }
}

async function doReset(){
  const p1 = document.getElementById('newPass').value;
  const p2 = document.getElementById('newPass2').value;
  if(p1.length<8){ document.getElementById('errReset').textContent='Mínimo 8 caracteres'; document.getElementById('errReset').style.display='block'; return; }
  if(p1!==p2){ document.getElementById('errReset').textContent='Las contraseñas no coinciden'; document.getElementById('errReset').style.display='block'; return; }
  const btn = document.getElementById('resetBtn');
  btn.disabled=true; btn.textContent='Guardando...';
  try {
    const r = await fetch(`${API}/auth/reset`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token:resetToken, newPassword:p1}) });
    const d = await r.json();
    if(!r.ok){ document.getElementById('errReset').textContent=d.error||'Error'; document.getElementById('errReset').style.display='block'; return; }
    document.getElementById('okReset').textContent = '✅ ¡Contraseña actualizada! Redirigiendo al login...';
    document.getElementById('okReset').style.display = 'block';
    setTimeout(()=> window.location.href='/cosmart-training-login.html', 2500);
  } catch(e){
    document.getElementById('errReset').textContent='Error. Intentá de nuevo.'; document.getElementById('errReset').style.display='block';
  } finally { btn.disabled=false; btn.textContent='Guardar nueva contraseña'; }
}
</script>
</body>
</html>
